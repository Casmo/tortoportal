<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Torto portal is a student tracking system built specifically for the Caribbean.">
    <title>Torto Portal</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #212529;
            background: #fff;
            text-align: center;
            line-height: 1.6;
        }
        main { max-width: 28rem; }
        .logo { width: 10rem; max-width: 60vw; height: auto; }
        h1 { margin: 1rem 0 0; font-size: 2rem; }
        .tagline { margin: 0 0 2rem; color: #6c757d; font-style: italic; }
        address { font-style: normal; }
        a { color: #0b3a9b; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .muted { color: #6c757d; font-size: .9em; }
    </style>
</head>
<body>
<main>
    <img src="/img/logo.png" class="logo" alt="Torto Portal logo" width="865" height="971">
    <h1>Torto</h1>
    <p class="tagline">Student tracking software</p>
    <address>
        <strong>Contact</strong><br>
        <a href="mailto:info@tortoportal.com">info@tortoportal.com</a><br>
        <a href="tel:+31613457564">+31 6 13 45 75 64</a> <span class="muted">(The Netherlands)</span><br>
        <a href="tel:+5993181717">+599 318 1717</a> <span class="muted">(St. Eustatius)</span>
    </address>
</main>
</body>
</html>
